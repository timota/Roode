substitutions:
  devicename: roode32idf
  friendly_name: ${devicename}

external_components:
  - source: components
    refresh: always

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

api:
  password: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG

web_server:
  port: 80

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: True

vl53l1x:
  sensor_id: 1
  timeout: 2000ms
  pins:
    xshut: GPIO16
    interrupt: GPIO18
  calibration:
    ranging: long
    # offset: 0mm
    # crosstalk: 0cps
    # sigma_threshold: 90mm
    # signal_threshold: 1024  # kcps
  interrupt_polarity: active_low  # or active_high

# Optional distance sensor (publishes readings). Roode can operate without it.
