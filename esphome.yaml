esphome:
  name: roode32idf
  friendly_name: roode32idf

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  password: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

external_components:
  - source: ./components

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

vl53l1x:
  - id: tof_sensor_1
    i2c_id: bus_a
    timeout: 2000ms
    pins:
      xshut: GPIO16
      interrupt: GPIO18
    calibration:
      ranging: long
      # If present, these values are applied at boot before any auto-cal. If absent,
      # stored values (if any) are loaded; auto-cal runs only when no stored values exist.
      # offset: 0mm
      # crosstalk: 0cps

button:
  # Manual VL53L1X calibration trigger. Runs offset+xtalk calibration and persists results.
  - platform: template
    name: "${friendly_name} Recalibrate ToF"
    entity_category: config
    on_press:
      - lambda: |-
          id(tof_sensor_1).calibrate_and_store();
